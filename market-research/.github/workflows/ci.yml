name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            mcp/avito-analytics/package-lock.json
            mcp/yandex-analytics/package-lock.json
            mcp/market-research-sqlite/package-lock.json
      - name: Install Avito MCP dependencies
        run: npm ci --prefix mcp/avito-analytics
      - name: Install Yandex MCP dependencies
        run: npm ci --prefix mcp/yandex-analytics
      - name: Install market-research SQLite MCP dependencies
        run: npm ci --prefix mcp/market-research-sqlite
      - name: Validate skill and MCP syntax
        run: npm run check
      - name: Test market-research SQLite MCP
        run: npm test --prefix mcp/market-research-sqlite
